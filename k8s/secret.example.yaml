# TEMPLATE ONLY - do not put real credentials in this file, it is committed.
#
# The worker pods pull these four values via the `ai-code-review-secrets`
# secretRef in deployment.yaml. Every one of them is read as an env var by
# src/main/resources/application.yml.
#
# Preferred: create the Secret imperatively so the values never touch git:
#
#   kubectl create secret generic ai-code-review-secrets \
#     --namespace code-review \
#     --from-literal=GITHUB_APP_TOKEN="$GITHUB_APP_TOKEN" \
#     --from-literal=GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
#
# Better still for anything long-lived: back these with External Secrets
# Operator or Vault so rotation does not mean re-running kubectl by hand.
#
# stringData is used rather than data so values are plain text, not base64.
apiVersion: v1
kind: Secret
metadata:
  name: ai-code-review-secrets
  namespace: code-review
type: Opaque
stringData:
  # GitHub App installation token (or PAT) used to read PR diffs and post the
  # review. Needs pull_requests: read+write on the target repos.
  GITHUB_APP_TOKEN: "replace-me"

  # Shared secret configured on the GitHub webhook. GitHubSignatureVerifier
  # FAILS CLOSED on a blank value, so leaving this unset rejects every
  # inbound delivery with a 401 and the pipeline does nothing at all.
  GITHUB_WEBHOOK_SECRET: "replace-me"

  # Provider keys. Only the providers named in review.agents[].provider are
  # actually called - trim application.yml's agent list if you only have one.
  ANTHROPIC_API_KEY: "replace-me"
  OPENAI_API_KEY: "replace-me"
